---
- name: Налаштування робочої станції Ubuntu 26
  hosts: all
  gather_facts: true

  vars:
    python_version: "3.12"
    # Lenovo ThinkStation P520 (Xeon W, зазвичай NVIDIA Quadro/RTX): драйвер
    # встановлюється лише якщо ввімкнено (потрібна відеокарта NVIDIA).
    install_nvidia_driver: false
    # Моделі Ollama для завантаження (порожній список — не завантажувати).
    ollama_models: []
    pyenv_root: "{{ ansible_facts['user_dir'] }}/.pyenv"
    workstation_packages:
      - build-essential
      - ca-certificates
      - curl
      - docker-compose-v2
      - docker.io
      - fwupd
      - git
      - git-crypt
      - htop
      - jq
      - libbz2-dev
      - libffi-dev
      - liblzma-dev
      - libncursesw5-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - lm-sensors
      - make
      - nano
      - openssh-client
      - smartmontools
      - pipx
      - tk-dev
      - tree
      - unzip
      - vim
      - wget
      - xz-utils
      - zip
      - zstd
      - zlib1g-dev
      - zsh

  tasks:
    - name: Перевірити операційну систему
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version == "26"
        fail_msg: "Цей playbook призначений для Ubuntu 26."

    - name: Оновити кеш пакетів APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Встановити базові програми
      ansible.builtin.apt:
        name: "{{ workstation_packages }}"
        state: present
      become: true

    - name: Клонувати репозиторій pyenv
      ansible.builtin.git:
        repo: https://github.com/pyenv/pyenv.git
        dest: "{{ pyenv_root }}"
        update: true

    - name: Налаштувати pyenv для Bash
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        create: true
        mode: "0644"
        block: |
          export PYENV_ROOT="$HOME/.pyenv"
          [[ -d "$PYENV_ROOT/bin" ]] && export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init - bash)"

    - name: Додати pyenv до PATH для наступних завдань
      ansible.builtin.set_fact:
        pyenv_bin: "{{ pyenv_root }}/bin/pyenv"

    - name: Встановити через pyenv Python {{ python_version }}
      ansible.builtin.command: "{{ pyenv_bin }} install --skip-existing {{ python_version }}"
      environment:
        PYENV_ROOT: "{{ pyenv_root }}"
      register: pyenv_install
      changed_when: "'Installing' in pyenv_install.stdout"

    - name: Зробити версією pyenv за замовчуванням {{ python_version }}
      ansible.builtin.command: "{{ pyenv_bin }} global {{ python_version }}"
      environment:
        PYENV_ROOT: "{{ pyenv_root }}"
      changed_when: false

    - name: Встановити pipenv через pipx
      ansible.builtin.command: pipx install pipenv
      args:
        creates: "{{ ansible_env.HOME }}/.local/bin/pipenv"

    - name: Додати ~/.local/bin до PATH (pipx)
      ansible.builtin.command: pipx ensurepath
      changed_when: false

    - name: Увімкнути та запустити Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
      become: true

    - name: Додати користувача до групи docker (потрібен повторний вхід)
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true
      become: true

    - name: Увімкнути SMART-моніторинг дисків
      ansible.builtin.systemd_service:
        name: smartmontools
        enabled: true
        state: started
      become: true

    - name: Встановити ubuntu-drivers-common (опційно)
      ansible.builtin.apt:
        name: ubuntu-drivers-common
        state: present
      become: true
      when: install_nvidia_driver | bool

    - name: Встановити драйвер NVIDIA (опційно)
      ansible.builtin.command: ubuntu-drivers install
      become: true
      when: install_nvidia_driver | bool
      register: nvidia_driver
      changed_when: "'installing' in (nvidia_driver.stdout | lower)"

    - name: Завантажити офіційний скрипт встановлення Ollama
      ansible.builtin.get_url:
        url: https://ollama.com/install.sh
        dest: /tmp/ollama-install.sh
        mode: "0755"

    - name: Встановити Ollama
      ansible.builtin.command: /tmp/ollama-install.sh
      args:
        creates: /usr/local/bin/ollama
      become: true

    - name: Увімкнути та запустити сервіс Ollama
      ansible.builtin.systemd_service:
        name: ollama
        enabled: true
        state: started
      become: true

    - name: Завантажити моделі Ollama
      ansible.builtin.command: "ollama pull {{ item }}"
      loop: "{{ ollama_models }}"
      changed_when: true
